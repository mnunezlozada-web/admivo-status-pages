<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Asuntos del despacho · CRN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Pagina de asuntos del despacho (08-oct-2026). La arma scripts/pagina-asuntos.py desde
     _asuntos/plantilla.html. Todo el contenido va cifrado: sin la contrasena no se ve nada.
     Reglas: _asuntos/REGLAS-ASUNTOS.md. -->
<style>
:root{--carbon:#272B2E;--bronce:#896950;--bronce2:#A88B6E;--piedra:#F3EFE8;--linea:#E3DDD3;--texto:#272B2E;--suave:#6B6560;
--rojo:#A93226;--rojo-f:#FBEDEB;--morado:#5B3B8C;--morado-f:#F1ECF8;--mio:#FBF3E8;--terc:#F2F1EF;--ambar:#9A6212;--ambar-f:#FBF2E2;--verde:#2F6B4F;--verde-f:#E8F2EC;--gris-f:#EFECE7;--azul:#2C5282;--azul-f:#E9EFF7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--piedra);color:var(--texto);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.banda{background:var(--carbon);color:#F3EFE8;padding:18px 16px 14px}
.banda .marca{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronce2)}
.banda h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:26px;margin:2px 0 6px;letter-spacing:.01em}
.banda .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:#CFC8BE}
.banda select,.banda .btn-claro{background:#383D41;border:1px solid #4A5055;color:#F3EFE8;border-radius:6px;padding:4px 8px;font-size:12.5px}
.contenedor{max-width:980px;margin:0 auto;padding:0 16px 40px}
.fichas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 14px}
.ficha{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px 12px}
.ficha .n{font-size:24px;font-weight:600;line-height:1.1}
.ficha .l{font-size:12px;color:var(--suave)}
.ficha.rojo .n{color:var(--rojo)} .ficha.ambar .n{color:var(--ambar)} .ficha.verde .n{color:var(--verde)}
.ficha.morado .n{color:var(--morado)} .ficha.azul .n{color:var(--azul)}
button.ficha{font:inherit;text-align:left;cursor:pointer;transition:border-color .12s,box-shadow .12s}
button.ficha:hover{border-color:var(--bronce2)}
button.ficha.activa{border-color:var(--carbon);box-shadow:0 0 0 1px var(--carbon) inset}
button.ficha.urgente{border-color:#E7B8B2;background:#FFF8F7}
button.ficha.urgente.activa{border-color:var(--rojo);box-shadow:0 0 0 1px var(--rojo) inset}
.filtro{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 6px;font-size:13px;color:var(--suave)}
.filtro b{color:var(--texto);font-weight:600}
.filtro button{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px}
.caja.urgente{border-color:#E7B8B2;border-left:4px solid var(--rojo);border-radius:0 10px 10px 0}
.caja.urgente h2{color:var(--rojo)}
.linea-u{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13.5px;padding:6px 0;border-top:1px solid #F3E4E1;cursor:pointer}
.linea-u:first-of-type{border-top:0}
.linea-u:hover .t{text-decoration:underline}
.linea-u .t{flex:1 1 260px}
.vistas{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.vistas button{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:500}
.vistas button[aria-selected="true"]{background:var(--carbon);border-color:var(--carbon);color:#fff}
.vistas button .c{opacity:.7;margin-left:4px;font-weight:400}
.chips{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:8px 10px 6px;margin:0 0 8px}
.chips .rot{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);font-weight:600;margin:2px 2px 5px}
.chips .fila{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chips button{border:1px solid var(--linea);background:var(--piedra);border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chips button:hover{border-color:var(--bronce2)}
.chips button[aria-selected="true"]{background:var(--carbon);border-color:var(--carbon);color:#fff}
.chips button .c{opacity:.65}
.chips .punto{width:7px;height:7px;border-radius:50%;background:var(--rojo);display:inline-block}
.chips button.agregar{background:#fff;border-style:dashed;border-color:var(--bronce2);color:var(--bronce);font-weight:500;white-space:normal;text-align:left}
.chips button.agregar[aria-selected="true"]{background:var(--carbon);border-style:solid;border-color:var(--carbon);color:#fff}
.caja{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.caja h2{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:18px;margin:0 0 6px}
.caja .ayuda{font-size:12.5px;color:var(--suave);margin:0}
.pestanas{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:4px 0 6px;scrollbar-width:thin}
.pestanas button{flex:0 0 auto;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.pestanas button[aria-selected="true"]{background:var(--carbon);border-color:var(--carbon);color:#fff}
.pestanas button .c{opacity:.7;margin-left:4px}
.cab-asunto{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--bronce);border-radius:0 10px 10px 0;padding:12px 14px;margin:0 0 10px}
.cab-asunto h2{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:19px;margin:0 0 4px}
.cab-asunto .d{font-size:13px;color:var(--suave)}
.grupo{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:16px 0 6px;font-weight:600}
.item{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:11px 13px;margin:0 0 8px;border-left:4px solid var(--linea)}
.item.vencido{border-left-color:var(--rojo)} .item.semana{border-left-color:var(--ambar)} .item.hecho{border-left-color:var(--verde);opacity:.86}
.item.espera{border-left-color:var(--azul)} .item.sinfecha{border-left-color:#B9B1A6}
.item .arriba{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--suave);margin-bottom:3px}
.etq{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:500;background:var(--gris-f);color:#4A4540}
.etq.asunto{background:#F1EAE2;color:#6E5440}
.etq.rojo{background:var(--rojo-f);color:var(--rojo)} .etq.ambar{background:var(--ambar-f);color:var(--ambar)}
.etq.verde{background:var(--verde-f);color:var(--verde)} .etq.azul{background:var(--azul-f);color:var(--azul)}
.etq.comp{background:var(--carbon);color:#fff}
.etq.termino{background:var(--morado);color:#fff;font-weight:600}
.etq.urg{background:var(--rojo);color:#fff;font-weight:600}
.etq.resp{border:1px solid transparent;font-weight:600}
.etq.resp.arturo{background:var(--carbon);color:#fff}
.etq.resp.mauricio{background:var(--bronce);color:#fff}
.etq.resp.terceros{background:#7A746D;color:#fff}
.etq.resp.sinresp{background:#fff;border-color:var(--rojo);color:var(--rojo)}
.item.de-mauricio{background:var(--mio);border-color:#E9DAC6}
.item.de-terceros{background:var(--terc);border-color:#DDD9D3}
.item.sin-resp{border-style:dashed;border-color:#D9A39C}
.guia{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:12.5px;color:var(--suave)}
.guia .fila{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.guia details{margin-top:6px} .guia summary{cursor:pointer;color:var(--bronce);font-size:12px}
.guia .est{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px;margin-top:6px}
.guia .b{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:6px}
.chips .ayuda2{font-size:12px;color:var(--suave);margin:-2px 2px 6px}
.item .que{font-size:15px}
.item .que.corto,.item .nota.corto{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.item .que.corto{-webkit-line-clamp:3} .item .nota.corto{-webkit-line-clamp:2}
.item .mas{border:0;background:none;padding:0;font-size:12px;color:var(--bronce);text-decoration:underline;cursor:pointer}
.item .nota{font-size:12.5px;color:var(--suave);margin-top:3px}
.marca-item.morado{background:var(--morado-f)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--suave);margin:0 2px 8px}
.marca-item{font-size:13px;margin-top:6px;padding:6px 9px;border-radius:7px;background:var(--gris-f)}
.marca-item.verde{background:var(--verde-f)} .marca-item.azul{background:var(--azul-f)} .marca-item.rojo{background:var(--rojo-f)}
.acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acciones button,.form button{border:1px solid var(--linea);background:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px}
.acciones button:hover,.form button:hover{border-color:var(--bronce)}
.acciones button.principal,.form button.principal{background:var(--carbon);border-color:var(--carbon);color:#fff}
.form{margin-top:8px;padding:10px;border:1px dashed var(--linea);border-radius:8px;background:#FBFAF7;display:grid;gap:8px}
.form label{font-size:12.5px;color:var(--suave);display:grid;gap:3px}
.form input,.form textarea,.form select{border:1px solid var(--linea);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
.form textarea{min-height:58px;resize:vertical}
.form .error{color:var(--rojo);font-size:12.5px;min-height:0}
.form .fila{display:flex;gap:6px;flex-wrap:wrap}
.vacio{color:var(--suave);font-size:14px;padding:10px 2px}
.pie{font-size:12.5px;color:var(--suave);margin-top:24px;border-top:1px solid var(--linea);padding-top:12px}
.aviso{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--carbon);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:92vw;display:none;z-index:9}
.aviso.error{background:var(--rojo)}
.puerta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--carbon)}
.puerta form{background:#fff;border-radius:12px;padding:26px 22px;width:100%;max-width:380px}
.puerta .marca{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronce)}
.puerta h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:24px;margin:4px 0 14px}
.puerta input[type=password]{width:100%;border:1px solid var(--linea);border-radius:7px;padding:10px 11px;margin:4px 0 10px;font-size:16px}
.puerta button{width:100%;background:var(--carbon);color:#fff;border:0;border-radius:7px;padding:10px;font-weight:500}
.puerta .rec{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--suave);margin:0 0 14px}
.puerta .error{color:var(--rojo);font-size:13px;min-height:18px;margin-top:8px}
.quien{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quien button{border:1px solid var(--linea);background:#fff;border-radius:7px;padding:8px 14px}
@media (max-width:560px){.banda h1{font-size:22px}.item .que{font-size:14.5px}.fichas{grid-template-columns:repeat(2,1fr);gap:7px}.ficha{padding:7px 10px}.ficha .n{font-size:20px}}
</style>
</head>
<body>
<div id="puerta" class="puerta">
  <form id="f-puerta" autocomplete="off">
    <div class="marca">CRN · Despacho</div>
    <h1>Asuntos del despacho</h1>
    <label for="clave" style="font-size:13px;color:var(--suave)">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <label class="rec"><input id="recordar" type="checkbox"> Recordar en este dispositivo</label>
    <button type="submit" id="b-entrar">Entrar</button>
    <div class="error" id="e-puerta" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>

/* ------------------------------------------------------------ cifrado */
async function llaves(clave, sal, it){
  const k = clave+"\u0000"+b64e(sal)+":"+it;   // la llave depende de la contrasena: un intento fallido no se reutiliza
  if (llavesCache[k]) return llavesCache[k];
  const base = await crypto.subtle.importKey("raw", te.encode(clave), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:sal,iterations:it}, base, 512));
  const r = { aes: await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"AES-CBC"}, false, ["encrypt","decrypt"]),
              mac: await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC",hash:"SHA-256"}, false, ["sign","verify"]) };
  llavesCache[k] = r; return r;
}
async function descifrar(clave, env){
  const sal=b64d(env.salt), iv=b64d(env.iv), ct=b64d(env.ct), mac=b64d(env.mac);
  const k = await llaves(clave, sal, env.it||200000);
  if (!await crypto.subtle.verify("HMAC", k.mac, mac, une(sal,iv,ct))) throw new Error("clave");
  return JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-CBC",iv}, k.aes, ct)));
}
async function cifrar(clave, obj){
  const it = (CIFRADO && CIFRADO.it) || 200000;
  if (!salEscritura) salEscritura = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const k = await llaves(clave, salEscritura, it);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC",iv}, k.aes, te.encode(JSON.stringify(obj))));
  const mac = new Uint8Array(await crypto.subtle.sign("HMAC", k.mac, une(salEscritura,iv,ct)));
  return {v:1,it,salt:b64e(salEscritura),iv:b64e(iv),ct:b64e(ct),mac:b64e(mac)};
}

/* ------------------------------------------------------------ GitHub */
function apiURL(){ return "https://api.github.com/repos/"+GH.user+"/"+GH.repo+"/contents/"+GH.ruta; }
function cabeceras(){ return {"Authorization":"token "+GH.token,"Accept":"application/vnd.github.v3+json"}; }
async function bajarEstado(){
  if (!GH) return {estado:ESTADO, sha:SHA};
  const r = await fetch(apiURL()+"?ref=main&t="+Date.now(), {headers:cabeceras(), cache:"no-store"});
  if (r.status===404) return {estado:{v:1,marcas:{},nuevos:[],compromisos:{},_log:[]}, sha:null};
  if (!r.ok) throw new Error("No se pudo leer lo guardado ("+r.status+")");
  const j = await r.json();
  const env = JSON.parse(td.decode(b64d(j.content)));
  const est = await descifrar(CLAVE, env);
  return {estado:normaliza(est), sha:j.sha};
}
async function subirEstado(est, sha){
  const env = await cifrar(CLAVE, est);
  const cuerpo = {message:"asuntos: "+(quien()||"pagina"), content:b64e(te.encode(JSON.stringify(env)))};
  if (sha) cuerpo.sha = sha;
  const r = await fetch(apiURL(), {method:"PUT", headers:Object.assign({"Content-Type":"application/json"},cabeceras()), body:JSON.stringify(cuerpo)});
  if (r.ok) { const j = await r.json(); return {ok:true, sha:j.content && j.content.sha}; }
  return {ok:false, status:r.status};
}
function normaliza(e){ e=e||{}; e.v=1; e.marcas=e.marcas||{}; e.nuevos=e.nuevos||[]; e.compromisos=e.compromisos||{}; e._log=e._log||[]; e.visitas=e.visitas||{}; return e; }
function copia(o){ return JSON.parse(JSON.stringify(o)); }

/* Cada accion es una funcion que se aplica sobre el estado mas reciente: si alguien guardo
   entre tanto, se baja lo suyo, se vuelve a aplicar lo nuestro y se sube otra vez. */
async function hacer(op, texto){
  if (!GH) { aviso("Esta copia de la página no puede guardar.", true); return; }
  if (!quien()) { aviso("Primero di quién eres (arriba).", true); return; }
  OPS.push(op); op(ESTADO); render(); await vaciar(texto);
}
async function vaciar(texto, silencioso){
  if (guardando) { otraVez = true; return; }
  guardando = true; if (!silencioso) aviso("Guardando…");
  try {
    let listo = false;
    for (let i=0; i<4 && !listo; i++) {
      const rem = await bajarEstado();
      const nuevo = copia(rem.estado);
      OPS.forEach(f => f(nuevo));
      if (nuevo._log.length > 400) nuevo._log = nuevo._log.slice(-400);
      const r = await subirEstado(nuevo, rem.sha);
      if (r.ok) { ESTADO = nuevo; SHA = r.sha; OPS = []; listo = true; }
      else if (r.status!==409 && r.status!==422) throw new Error("GitHub contestó "+r.status);
    }
    if (!listo) throw new Error("no se pudo guardar después de varios intentos");
    if (!silencioso) aviso(texto || "Guardado");
  } catch (e) {
    if (!silencioso) aviso("No se guardó: "+e.message+". Revisa tu conexión y vuelve a intentar.", true);
  } finally {
    guardando = false; render();
    if (otraVez) { otraVez = false; vaciar(); }
  }
}
function marcaDe(s, id){ s.marcas[id] = s.marcas[id] || {}; return s.marcas[id]; }
function registra(s, accion, id, texto){ s._log.push({cuando:ahoraISO(), quien:quien(), accion, id, texto:texto||""}); }

/* ------------------------------------------------------------ lo que se ve */
function rec(clave, id){ const r=(D.reconciliado||{})[clave]||{}; return r[id]; }
function vigente(clave, id, cuando){ const r = rec(clave,id); return !(r && String(r.cuando||"") >= String(cuando||"")); }
function efectivo(it){
  const hoy = hoyMX(), m = ESTADO.marcas[it.id] || {};
  const hecho = (m.hecho && vigente("rechazos", it.id, m.hecho.cuando)) ? m.hecho : null;
  const rechazo = (m.hecho && !hecho) ? rec("rechazos", it.id) : null;
  let fecha = it.fecha, propuesta = null;
  if (m.fecha && m.fecha.valor && vigente("fechas", it.id, m.fecha.cuando)) { fecha = m.fecha.valor; propuesta = m.fecha; }
  const espera = (m.espera && m.espera.de) ? m.espera : null;
  const obs = (m.obs && m.obs.texto && vigente("obs", it.id, m.obs.cuando)) ? m.obs : null;
  let grupo = "sinfecha";
  if (hecho) grupo = "hecho";
  else if (espera) grupo = "espera";
  else if (fecha && fecha < hoy) grupo = "vencido";
  else if (fecha && dias(hoy, fecha) <= 7) grupo = "semana";
  else if (fecha) grupo = "adelante";
  const cambios = (it.cambios_fecha||0) + ((m.fecha && m.fecha.cambios)||0);
  // Termino legal: el que se marco en la pagina gana sobre el de la hoja hasta que la revision de
  // la noche lo integra (o lo quita: {quitado:true}).
  let termino = it.termino && it.termino.vence ? it.termino : null;
  if (m.termino && vigente("terminos", it.id, m.termino.cuando)) termino = m.termino.quitado ? null : m.termino;
  const urgente = (m.urgente && m.urgente.por) ? m.urgente : null;
  const e = {fecha, grupo, hecho, rechazo, espera, obs, propuesta, cambios, termino, urgente};
  e.urg = !hecho && (!!urgente || (termino && dias(hoy, termino.vence) <= DIAS_URGENTE) || (fecha && fecha === hoy));
  return e;
}
function enFiltro(e, f){
  if (f === "todos") return e.grupo !== "hecho";
  if (f === "urgente") return e.urg;
  if (f === "termino") return !!e.termino && e.grupo !== "hecho";
  return e.grupo === f;
}
const FILTROS = {todos:"Todos", urgente:"Atención urgente", termino:"Términos legales", vencido:"Vencidos", semana:"Vencen en 7 días", sinfecha:"Sin fecha", espera:"En espera de otros", hecho:"Marcados como hechos"};
function etiquetaTermino(t){
  const d = dias(hoyMX(), t.vence);
  if (d < 0) return h("span",{class:"etq urg"},"TÉRMINO VENCIDO hace "+(-d)+" día"+(d===-1?"":"s")+" · "+corta(t.vence));
  if (d === 0) return h("span",{class:"etq urg"},"TÉRMINO vence HOY");
  return h("span",{class:"etq termino"},"TÉRMINO · vence "+corta(t.vence)+" · faltan "+d+" día"+(d===1?"":"s"));
}
function tipoResp(q){
  const t = String(q||"").trim();
  if (!t || /^sin asignar|^sin responsable/i.test(t)) return "sinresp";
  if (esPersona(t)) return "arturo";
  if (esMauricio(t)) return "mauricio";
  return "terceros";
}
function etiquetaResp(q, texto){
  const k = tipoResp(q);
  return h("span",{class:"etq resp "+k}, texto || (k==="sinresp" ? "SIN RESPONSABLE" : String(q).trim()));
}
function textoLargo(cls, txt, clave, limite){
  if (txt.length <= limite || expandidos[clave]) return h("div",{class:cls}, txt);
  return h("div",null, h("div",{class:cls+" corto"}, txt), h("button",{class:"mas",type:"button",onclick:()=>{expandidos[clave]=true;render();}},"ver más"));
}
function todos(){
  const base = D.pendientes.slice();
  const integrados = (D.reconciliado||{}).nuevos || {};
  ESTADO.nuevos.forEach(n => { if (!integrados[n.id] && !n.retirado) base.push({id:n.id, asunto:n.asunto, que:n.que, quien:n.quien, fecha:n.fecha||"", prioridad:2, nota:"", desde:(n.cuando||"").slice(0,10), fuente:"pagina", nuevo:n, de_persona:esPersona(n.quien), de_mauricio:esMauricio(n.quien)}); });
  // "Me toca" (Arturo) o "Asignar a Arturo" (Mauricio): el pendiente pasa a la persona desde ya;
  // la revision de la noche cambia el responsable en la hoja.
  return base.map(it => {
    const m = ESTADO.marcas[it.id] || {};
    if (!m.asignado || m.asignado.quitado || !m.asignado.a || !vigente("asignados", it.id, m.asignado.cuando) || esPersona(it.quien)) return it;
    return Object.assign({}, it, {antes:it.quien, quien:m.asignado.a, asignado:m.asignado, de_persona:true, de_mauricio:false});
  });
}
function P_(){ return (D && D.persona) || "Arturo"; }
/* Un asunto puede venir del expediente (D.asuntos), del catalogo de asuntos del despacho que hoy no
   tienen pendientes abiertos (D.catalogo) o de un pendiente agregado aqui para un asunto nuevo
   (asunto_nuevo). Mauricio, 16-oct-2026: "otro [boton] hasta el final que permita agregar pendientes
   de asuntos que no estan en la lista". */
function cortoDe(t){ t = String(t||""); return t.length > 28 ? t.slice(0,27).trim()+"…" : t; }
function asunto(c){
  const a = D.asuntos.find(a => a.clave===c); if (a) return a;
  const k = (D.catalogo||[]).find(a => a.clave===c);
  if (k) return {clave:c, corto:k.corto||cortoDe(k.nombre), nombre:k.nombre, cliente:k.cliente||"Por confirmar", lleva:k.lleva||"", fuera:true};
  const n = ESTADO.nuevos.find(x => x.asunto===c && x.asunto_nuevo && x.asunto_nuevo.nombre);
  if (n) return {clave:c, corto:cortoDe(n.asunto_nuevo.nombre), nombre:n.asunto_nuevo.nombre, cliente:n.asunto_nuevo.cliente||"Por confirmar", lleva:"", fuera:true, nuevo:true};
  return {clave:c, corto:c, nombre:c, cliente:"Por confirmar"};
}
/* Los asuntos que no vienen del expediente pero tienen un pendiente agregado aqui, todavia sin integrar. */
function asuntosExtra(){
  const vistos = new Set(D.asuntos.map(a => a.clave)), r = [], integrados = (D.reconciliado||{}).nuevos || {};
  ESTADO.nuevos.forEach(n => { if (n.retirado || integrados[n.id] || !n.asunto || vistos.has(n.asunto)) return; vistos.add(n.asunto); r.push(asunto(n.asunto)); });
  return r;
}
function ordenar(lista){
  const pos = {}; GRUPOS.forEach((g,i)=>pos[g[0]]=i);
  return lista.map(it => ({it, e:efectivo(it)})).sort((a,b) => (pos[a.e.grupo]-pos[b.e.grupo]) || String(a.e.fecha||"9999").localeCompare(String(b.e.fecha||"9999")) || (a.it.prioridad-b.it.prioridad) || a.it.id.localeCompare(b.it.id));
}
function compromisos(){ const c = ESTADO.compromisos[semana(hoyMX())]; return (c && c.ids) || []; }

function etiquetaFecha(e){
  const hoy = hoyMX();
  if (!e.fecha) return h("span",{class:"etq"},"sin fecha");
  const d = dias(hoy, e.fecha);
  if (d < 0) return h("span",{class:"etq rojo"},"vencido hace "+(-d)+" día"+(d===-1?"":"s")+" · "+corta(e.fecha));
  if (d === 0) return h("span",{class:"etq rojo"},"vence hoy");
  if (d === 1) return h("span",{class:"etq ambar"},"vence mañana · "+corta(e.fecha));
  if (d <= 7) return h("span",{class:"etq ambar"},"vence en "+d+" días · "+corta(e.fecha));
  return h("span",{class:"etq"},"vence "+corta(e.fecha));
}

  if (e.hecho) div.appendChild(h("div",{class:"marca-item verde"}, "Marcado como hecho por "+(e.hecho.por||"")+" el "+cuandoTexto(e.hecho.cuando)+". Prueba: "+(e.hecho.prueba||"")+". Se confirma en la revisión de la noche."));

  else if (!e.hecho && !it.de_persona && (tr==="mauricio" || tr==="sinresp") && (quien()==="Arturo" || quien()==="Mauricio")) ac.appendChild(h("button",{onclick:()=>hacer(s=>{ marcaDe(s,id).asignado={a:"Arturo Cuadra Arellano",por:quien(),cuando:ahoraISO()}; registra(s,"asigno a Arturo",id,it.quien||""); }, quien()==="Arturo" ? "Anotado: te toca" : "Asignado a Arturo")}, quien()==="Arturo" ? "Me toca" : "Asignar a Arturo"));
  if (!e.hecho && quien()==="Mauricio") ac.appendChild(e.urgente
    ? h("button",{onclick:()=>hacer(s=>{ marcaDe(s,id).urgente=null; registra(s,"quito urgente",id); },"Ya no está marcado urgente")},"Quitar urgente")
    : h("button",{onclick:()=>abrir(id,"urgente")},"Marcar urgente"));

  div.appendChild(ac);
  if (abierto && abierto.id===id) div.appendChild(formulario(it, e, abierto.tipo));
  return div;

function abrir(id, tipo){ abierto = (abierto && abierto.id===id && abierto.tipo===tipo) ? null : {id, tipo}; render(); const f=document.querySelector(".form textarea, .form input"); if (f) f.focus(); }
function alternaCompromiso(id){
  const sem = semana(hoyMX()), act = compromisos();
  if (!act.includes(id) && act.length >= 3) { aviso("Máximo 3 compromisos por semana. Quita uno primero.", true); return; }

}

  }
  if (tipo==="espera") {
    const de = h("input",{type:"text",placeholder:"Ej.: el juzgado, el cliente, la notaría"});

      h("div",{class:"d"},"Si el asunto ya es del despacho pero hoy no tiene pendientes abiertos, escógelo. Si es nuevo, escribe su nombre. Se integra en la revisión de la noche; un asunto nuevo que agregue "+P+" se le confirma a Mauricio.")));
    c.appendChild(formNuevo(null));
  }
  if (pestana!=="otro") c.appendChild(h("div",{class:"acciones",style:"margin-top:18px"},
    h("button",{type:"button",onclick:()=>{ abierto=null; ir("otro"); }},"+ Agregar pendiente de un asunto que no está en la lista")));
  c.appendChild(h("div",{class:"pie"},
    h("p",null,"Lo que marques aquí se integra al expediente en la revisión de la noche. Un pendiente se cierra cuando la revisión encuentra la prueba que escribiste; si no la encuentra, aquí te dice qué falta."),
    h("p",null,"Para cambiar el texto de un pendiente o quitarlo, díselo a Mauricio: aquí se marca, el expediente se decide en el despacho."),
    h("p",null,"Página privada del despacho. No compartas la contraseña.")));
}

async function recargar(){
  try { const r = await bajarEstado(); ESTADO = r.estado; SHA = r.sha; OPS.forEach(f=>f(ESTADO)); render(); aviso("Al día"); }
  catch(e){ aviso("No se pudo actualizar: "+e.message, true); }
}

async function entrar(clave, recordar){
  const datos = await descifrar(clave, CIFRADO);
  CLAVE = clave; D = datos.datos; GH = datos.gh;
  if (recordar) { try { localStorage.setItem("asuntos_clave", clave); } catch(e){} }
  document.getElementById("puerta").hidden = true; document.getElementById("puerta").style.display="none";
  document.getElementById("app").hidden = false;
  render();
  if (GH) { await recargar(); registrarVisita(); }
}

document.getElementById("f-puerta").addEventListener("submit", async ev => {
  ev.preventDefault();
  const e = document.getElementById("e-puerta"), b = document.getElementById("b-entrar");
  const v = document.getElementById("clave").value.trim();
  if (!v) { e.textContent = "Escribe la contraseña."; return; }
  if (!CIFRADO) { e.textContent = "Esta página está vacía."; return; }
  b.disabled = true; b.textContent = "Abriendo…"; e.textContent = "";
  try { await entrar(v, document.getElementById("recordar").checked); }
  catch (x) { e.textContent = x.message==="clave" ? "La contraseña no es correcta." : "No se pudo abrir: "+x.message; b.disabled=false; b.textContent="Entrar"; }
});
document.getElementById("clave").addEventListener("input", () => { document.getElementById("e-puerta").textContent = ""; });
(async () => {
  let g = ""; try { g = localStorage.getItem("asuntos_clave") || ""; } catch(e){}
  if (g && CIFRADO) { try { await entrar(g, false); } catch(e){ try { localStorage.removeItem("asuntos_clave"); } catch(x){} } }
})();
</script>
